<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="300" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="16" fill="url(#grid)"/>

  <!-- pipeline motif: source -> stream -> store -> model -->
  <g transform="translate(720 95)" fill="none" stroke-width="2">
    <path d="M60 55H120M200 55H260M340 55H370" stroke="#7c8cf8" stroke-dasharray="6 6"/>
    <rect x="0" y="25" width="60" height="60" rx="12" stroke="#38bdf8"/>
    <rect x="120" y="25" width="80" height="60" rx="30" stroke="#60a5fa"/>
    <rect x="260" y="25" width="80" height="60" rx="12" stroke="#818cf8"/>
    <circle cx="390" cy="55" r="22" stroke="#a78bfa"/>
  </g>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">
    <text x="750" y="205">APIs</text>
    <text x="880" y="205">Kafka</text>
    <text x="1020" y="205">Postgres</text>
    <text x="1110" y="205">LLM</text>
  </g>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="64" y="120" font-size="52" font-weight="700" fill="#f8fafc">Snigdha Srivastva</text>
    <rect x="64" y="140" width="96" height="4" rx="2" fill="url(#accent)"/>
    <text x="64" y="190" font-size="24" fill="#cbd5e1">Software Engineer · Backend, Data &amp; Applied AI</text>
    <text x="64" y="232" font-size="17" fill="#94a3b8">Event-driven systems · Data pipelines · RAG / LLM apps · NYU MS CS</text>
  </g>
</svg>
